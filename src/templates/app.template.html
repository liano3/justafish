<!DOCTYPE html>
<html lang="{{HTML_LANG}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{APP_TITLE}} · {{SITE_NAME}}</title>
    <meta name="description" content="{{APP_DESCRIPTION}}">
    <meta name="author" content="{{PROFILE_NAME}}">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{APP_URL}}">
    <!-- FEATURE:language:START -->
    <link rel="alternate" hreflang="zh-CN" href="{{ZH_APP_URL}}">
    <link rel="alternate" hreflang="en" href="{{EN_APP_URL}}">
    <link rel="alternate" hreflang="x-default" href="{{ZH_APP_URL}}">
    <!-- FEATURE:language:END -->
    <link rel="icon" href="{{SITE_FAVICON}}">
    {{THEME_BOOTSTRAP}}
    <link rel="stylesheet" href="{{SITE_STYLESHEET_URL}}">
    <link rel="stylesheet" href="{{APP_STYLESHEET_URL}}">
</head>
<body>
    <div class="app">
        {{HEADER}}

        <main class="app-detail-main">
            <div class="app-detail-container{{APP_LAYOUT_CLASS}}">
                <div class="app-detail-heading">
                    <a class="app-detail-back" href="{{APPS_URL}}" aria-label="{{T_BACK_TO_APPS}}" title="{{T_BACK_TO_APPS}}">
                        <svg aria-hidden="true"><use href="{{ICON_SPRITE_URL}}#chevron-left"></use></svg>
                    </a>
                    <div class="app-detail-title">
                        <h1>{{APP_TITLE}}</h1>
                    </div>
                </div>
                <section class="tool-body" aria-label="{{APP_TITLE}}">
                    {{APP_CONTENT}}
                </section>
            </div>
        </main>

        {{FOOTER}}
        {{MOBILE_NAVIGATION}}
    </div>

    <script>{{RUNTIME_CONFIG}}</script>
    <script src="{{APP_SCRIPT_URL}}" defer></script>
    {{VISITOR_COUNTER_SCRIPT}}
</body>
</html>
