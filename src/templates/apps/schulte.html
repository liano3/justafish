<div>
    <div class="game-stats">
        <div class="game-stat"><div class="game-stat-value" id="schulteTime">0.00</div><div class="game-stat-label">{{T_CURRENT_TIME}}</div></div>
        <div class="game-stat"><div class="game-stat-value" id="schulteBest">-</div><div class="game-stat-label">{{T_BEST_SCORE}}</div></div>
    </div>
    <div class="schulte-grid-wrapper">
        <button class="schulte-overlay" id="schulteOverlay" type="button"><span class="button button-primary">{{T_CLICK_TO_START}}</span></button>
        <div class="schulte-grid" id="schulteGrid"></div>
    </div>
    <div class="game-controls"><button class="button button-primary" id="schulteRestart">{{T_RESTART}}</button></div>
</div>
