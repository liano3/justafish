<div>
    <div class="schulte-info">
        <div class="schulte-stat"><div class="schulte-stat-value" id="schulteTime">0.00</div><div class="schulte-stat-label">{{T_CURRENT_TIME}}</div></div>
        <div class="schulte-stat"><div class="schulte-stat-value" id="schulteBest">-</div><div class="schulte-stat-label">{{T_BEST_SCORE}}</div></div>
    </div>
    <p class="schulte-status" id="schulteStatus" role="status" aria-live="polite"></p>
    <div class="schulte-grid-wrapper">
        <button class="schulte-overlay" id="schulteOverlay" type="button"><span class="button button-primary">{{T_CLICK_TO_START}}</span></button>
        <div class="schulte-grid" id="schulteGrid"></div>
    </div>
    <div class="schulte-controls"><button class="button button-primary" id="schulteRestart">{{T_RESTART}}</button></div>
</div>
